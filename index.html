<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>1132913 - HW10</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>黑白棋 Othello</h1>
        <div class="status-bar">
            <div class="score">黑棋 (User): <span id="black-score">2</span></div>
            <div class="score">白棋 (AI): <span id="white-score">2</span></div>
            <div class="turn">當前回合: <span id="current-turn">黑棋</span></div>
        </div>
        
        <div class="controls">
            AI 難度：
            <select id="ai-difficulty">
                <option value="basic">基本棋力</option>
                <option value="advanced">進階棋力</option>
            </select>
            <button onclick="resetGame()">重新開始</button>
        </div>

        <div id="board" class="board"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
