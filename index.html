<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>1132913 -HW10</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="text-align: center; font-family: Arial, sans-serif;">
        <h1>黑白棋 Othello</h1>
        <div class="status-bar" style="margin-bottom: 10px;">
            <span class="score">黑棋 (User): <b id="black-score">2</b></span> | 
            <span class="score">白棋 (AI): <b id="white-score">2</b></span> | 
            <span class="turn">當前回合: <b id="current-turn">黑棋</b></span>
        </div>
        
        <div class="controls">
            AI 難度：
            <select id="ai-difficulty">
                <option value="basic">基本棋力 (貪婪)</option>
                <option value="advanced" selected>進階棋力 (權重)</option>
            </select>
            <button onclick="resetGame()">重新開始</button>
        </div>

        <div id="board" class="board"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
